password-storage.title=Password Storage

password-storage.stage1.hint1=The database dump includes a five-word training list and Maria's SHA-256 hash.
password-storage.stage1.hint2=Run the supplied wordlist tool, then submit the matching candidate.
password-storage.stage1.success=Correct. Fast, unsalted SHA-256 made the weak password cheap to recover offline.
password-storage.stage1.failure=That candidate does not match Maria's hash.

password-storage.stage2.hint1=Alice and Bob still share a password, but each record uses a different salt.
password-storage.stage2.hint2=A salt is public. Use Maria's salt when hashing each candidate.
password-storage.stage2.success=Correct. Unique salts hide password equality and prevent work reuse, but the weak password is still guessable.
password-storage.stage2.failure=Check both the inference and Maria's salted hash.

password-storage.stage3.hint1=The dollar signs divide the algorithm, version, parameters, salt, and output.
password-storage.stage3.hint2=In m=19456,t=2,p=1, m is memory in KiB, t is iterations, and p is parallelism.
password-storage.stage3.success=Correct. Argon2id makes every candidate consume configured memory and processing time.
password-storage.stage3.failure=One or more PHC fields or the cost comparison is incorrect.

password-storage.stage4.hint1=The salt, algorithms, and work parameters are already present in the dump.
password-storage.stage4.hint2=HMAC verification requires a key that is not stored in this database.
password-storage.stage4.success=Correct. The database lacks the pepper, so this dump alone cannot verify guesses against the final HMAC value.
password-storage.stage4.failure=Identify which secret the final HMAC needs and whether the dump contains it.

password-storage.stage5.hint1=Retrieve the published application.properties backup.
password-storage.stage5.hint2=Copy the exposed pepper into the bounded attack tool.
password-storage.stage5.success=Correct. Exposing the configuration removed the pepper's protection.
password-storage.stage5.failure=That password does not match Maria's peppered verifier.
