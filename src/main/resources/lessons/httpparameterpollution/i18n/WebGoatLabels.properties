http-parameter-pollution.title=HTTP Parameter Pollution

http-parameter-pollution.hints.observation.1=Can one parameter name occur more than once in a query string?
http-parameter-pollution.hints.observation.2=Try name=WebGoat&name=OWASP.
http-parameter-pollution.observation.success=The two components received the same request but used its values differently.
http-parameter-pollution.observation.try-again=Both components currently agree. Change one name value and submit the form again.

http-parameter-pollution.hints.transfer.1=Submit one transfer to alice and one to attacker. Compare the feedback from both requests.
http-parameter-pollution.hints.transfer.2=The form has one recipient input, but the HTTP request can contain recipient more than once. Intercept the request or edit it with your browser tools.
http-parameter-pollution.hints.transfer.3=Validation checks the first recipient value, while the transfer uses the last value.
http-parameter-pollution.hints.transfer.4=Send alice as the first recipient and attacker as the last recipient. Keep a single amount with the value 100.
http-parameter-pollution.transfer.missing-recipient=The recipient parameter is missing.
http-parameter-pollution.transfer.invalid-amount=Submit exactly one numeric amount with a value of 100.
http-parameter-pollution.transfer.invalid-recipient=The transfer did not send 100 credits to the attacker.
http-parameter-pollution.transfer.unauthorized=The validated recipient is not approved.
http-parameter-pollution.transfer.allowed=The transfer to alice succeeded, but the exploit assignment is not complete.
http-parameter-pollution.transfer.success=The validation passed for alice, but the transfer sent 100 credits to the attacker.
