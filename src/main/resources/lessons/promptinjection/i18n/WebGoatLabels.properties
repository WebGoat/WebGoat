promptinjection.title=Indirect Prompt Injection (MCP)

promptinjection.task1.hint1=Connect your assistant to the MCP URL from the previous page and ask it to total sample.csv with the invoicehelper tools.
promptinjection.task1.hint2=Open "Show the tools/list response" to see exactly what your assistant reads. The payload is in the total_invoices description.
promptinjection.task1.hint3=A capable model often refuses the blunt variant. Try the task-shaped or parameter variant, start a new session so the assistant lists the tools again, and use a small or fast model.
promptinjection.task1.hint4=The assignment is solved when the session_token from get_account arrives in a total_invoices argument. You never need to type the token yourself.
promptinjection.task1.success=Your assistant called {0} with the session_token in the ''{1}'' argument. You never typed that token: the instruction came from the tool description, and the assistant treated it as part of your task.
promptinjection.task1.no-calls=The invoice server has not received any tool calls yet. Connect your assistant with the MCP URL from the connect page and ask it to total sample.csv.
promptinjection.task1.resisted=Your assistant called the server but did not forward the session_token. The model resisted this variant. Try another description variant, start a fresh session so the tools are listed again, or switch to a smaller model.
promptinjection.task1.guarded=The server refused the token because the argument guard is on. Turn the guard off on the next page to see the vulnerable behaviour, then repeat the task.

promptinjection.task2.hint1=Turn on the argument guard and leave pinned descriptions off, so the assistant still receives the poisoned description.
promptinjection.task2.hint2=Repeat the task in a fresh assistant session. The assistant tries to send the token, and the server refuses the call.
promptinjection.task2.hint3=Then turn on pinned descriptions and reconnect: the assistant no longer even tries. Which of the two controls would still hold if the description were poisoned upstream?
promptinjection.task2.success=The server refused a call that carried the session_token. The defence held even though the model obeyed the injected instruction, because a deterministic check does not depend on the model.
promptinjection.task2.guard-off=The argument guard is off. Turn it on and repeat the task.
promptinjection.task2.no-refusal=The guard is on, but no token-bearing call has reached the server since. Keep pinned descriptions off, use a variant your assistant followed on the previous page and repeat the task in a fresh session.

promptinjection.quiz.success=Congratulations, you answered every question correctly.
promptinjection.quiz.failure=Not all answers are correct. Review the mitigations page and try again.
