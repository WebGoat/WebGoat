webauthn.title=Security Keys & WebAuthn

# Registration assignment
webauthn.registration.success=Well done! GoatBank stored your security key on Jerry's account. You can now sign in as Jerry without knowing any of his secrets.
webauthn.registration.registered=The security key was registered for account {0}. That is what GoatBank intended, but can you get it registered on the account of Jerry?
webauthn.registration.unknown-account=GoatBank has no account named {0}. Have a look at how the user handle is constructed.
webauthn.registration.rejected=GoatBank rejected the registration: {0}
webauthn.registration.no-challenge=No registration in progress, start again with step 1.
webauthn.registration.hint1=Look at the request body of the finish request: which field could tell GoatBank which account the key is for?
webauthn.registration.hint2=The userHandle is base64url encoded. Decode it and see what it contains.
webauthn.registration.hint3=The userHandle is not covered by any signature, so GoatBank cannot tell if it was changed.
webauthn.registration.hint4=Base64url encode 'jerry' (amVycnk) and use it as the userHandle before finishing the registration.

# Authentication assignment
webauthn.authentication.success=Congratulations, you are signed in as Jerry by replaying an old assertion! GoatBank never checked the challenge.
webauthn.authentication.signed-in=Signed in as {0}. Now try to become Jerry.
webauthn.authentication.rejected=GoatBank rejected the sign in: {0}
webauthn.authentication.hint1=You cannot produce a valid signature for Jerry's key, but maybe someone already did.
webauthn.authentication.hint2=Read the attachment of the support ticket.
webauthn.authentication.hint3=Compare the challenge in the decoded clientDataJSON of the captured request with the challenge from the options GoatBank just sent you.
webauthn.authentication.hint4=Send the captured request body unchanged to /WebAuthn/authentication/finish.

# Bonus: security key
webauthn.securitykey.success=You signed in with your security key and the server verified the full assertion!
webauthn.securitykey.rejected=The security key sign in was rejected: {0}
webauthn.securitykey.hint1=WebAuthn only works in a secure context: use https:// or http://localhost, an IP address cannot be used as RP ID.
webauthn.securitykey.hint2=No security key? In Chrome open DevTools, More tools, WebAuthn and enable the virtual authenticator environment with protocol ctap2 and transport usb.
webauthn.securitykey.hint3=Register the key first, then sign in. Every step requests a fresh challenge, so resubmitting an old response will fail.
