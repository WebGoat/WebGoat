name: DevSecOps Assessment

on:
  workflow_dispatch: {}
  # pull_request: {}
  # push:
  #   branches:
  #   - main
  #   - master

permissions:
  contents: read
  security-events: write
    
jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    #if: always()
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: returntocorp/semgrep
    steps:
    - uses: actions/checkout@v3
    - run: semgrep ci
      continue-on-error: true

  ggshield:
    name: GitGuardian
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history so multiple commits can be scanned
      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@v1.55.0
        #if: always()
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          
  snyk:
    name: snyk-sca 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: SCA scan (report only)
        #if: always()
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --sarif-file-output=snyk-sca.sarif --json-file-output=snyk-sca.json
      - name: Monitor in Snyk web app
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca
      - uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: snyk-sca.json
          
  zap_scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        #if: always()
        continue-on-error: true
        with:
          #token: ${{ secrets.GITHUB_TOKEN }}
          #docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://preview.owasp-juice.shop'
          #rules_file_name: '.zap/rules.tsv'
          #cmd_options: '-a'
          cmd_options: '-J zap-report.json -I'
          allow_issue_writing: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: zap-report.json
          if-no-files-found: warn
          
 
  iac_security_scan:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Report Folder and List Docs files
      run: |
        mkdir -p reports
        ls -al reports
        echo "List Docs Folders"
        ls $SCAN_PATH -al 
        
    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Snyk CLI
      run: |
        npm install -g snyk
        snyk --version

    - name: Run Snyk IaC Scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true
      run: |
        echo "Snyk Version"
        snyk --version
        echo "Testing Authentication"
        snyk auth $SNYK_TOKEN
        echo "Testing Account Access"
        snyk whoami
        echo "============= SNYK IaC SCAN =============" > reports/snyk-iac-report.txt
        snyk iac test .  --severity-threshold=high  --json-file-output=reports/snyk-iac.json >> reports/snyk-iac-report.txt 2>&1 || true
        # snyk monitor  => For Monitoring in Snyk Dashboard all vulnerabilties
        
    - name: Upload Snyk Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: snyk-iac-report
        path: reports/
        if-no-files-found: warn

    # - name: Upload All Reports
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: iac-security-reports
    #     path: reports/


  security_gate:
    runs-on: ubuntu-latest
    #if: always()
    continue-on-error: true
    needs:
          - semgrep
          - ggshield
          - snyk
          - zap_scan
          - iac_security_scan
    steps:
      - name: Download Snyk Reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: snyk-iac-reports
          path: reports
            
      - name: IaC Security Gate
        if: always()
        shell: bash
        env:
          # CUSTOMIZABLE POLICY
          FAIL_ON_CRITICAL: "true"
          FAIL_ON_HIGH: "true"
          FAIL_ON_MEDIUM: "false"
          FAIL_ON_LOW: "false"
          FAIL_ON_INFO: "false"

        run: |
          set -euo pipefail

          REPORT="reports/snyk-iac.json"
          EXIT_FILE="reports/snyk-exit-code.txt"

          echo "======================================"
          echo "       SNYK IaC SECURITY GATE"
          echo "======================================"

          # Fail safely if the scan did not complete successfully.
          if [[ ! -s "$REPORT" || ! -s "$EXIT_FILE" ]]; then
            echo "❌ FAILED: Snyk report or exit code missing"
            exit 1
          fi

          if ! jq empty "$REPORT" >/dev/null 2>&1; then
            echo "❌ FAILED: Invalid Snyk JSON report"
            exit 1
          fi

          # Snyk CLI exit codes 2 and 3 indicate scan errors.
          # Exit code 1 can mean findings were detected.
          SNYK_EXIT_CODE=$(cat "$EXIT_FILE")

          if [[ ! "$SNYK_EXIT_CODE" =~ ^[0-9]+$ ]]; then
            echo "❌ FAILED: Invalid Snyk exit code"
            exit 1
          fi

          if (( SNYK_EXIT_CODE > 1 )); then
            echo "❌ FAILED: Snyk scan execution error"
            echo "Exit code: $SNYK_EXIT_CODE"
            exit 1
          fi

          # Verify the expected Snyk IaC report structure.
          if ! jq -e \
            '(.infrastructureAsCodeIssues | type) == "array"' \
            "$REPORT" >/dev/null; then
            echo "❌ FAILED: Unexpected Snyk report structure"
            exit 1
          fi

          # Count findings by severity.
          CRITICAL=$(jq '[.infrastructureAsCodeIssues[]? |
            select((.issue.severity // .severity // "" | ascii_downcase) == "critical")] | length' "$REPORT")

          HIGH=$(jq '[.infrastructureAsCodeIssues[]? |
            select((.issue.severity // .severity // "" | ascii_downcase) == "high")] | length' "$REPORT")

          MEDIUM=$(jq '[.infrastructureAsCodeIssues[]? |
            select((.issue.severity // .severity // "" | ascii_downcase) == "medium")] | length' "$REPORT")

          LOW=$(jq '[.infrastructureAsCodeIssues[]? |
            select((.issue.severity // .severity // "" | ascii_downcase) == "low")] | length' "$REPORT")

          INFO=$(jq '[.infrastructureAsCodeIssues[]? |
            select((.issue.severity // .severity // "" | ascii_downcase) == "info" or
                   (.issue.severity // .severity // "" | ascii_downcase) == "informational")] | length' "$REPORT")

          echo "--------------------------------------"
          echo "Critical       : $CRITICAL"
          echo "High           : $HIGH"
          echo "Medium         : $MEDIUM"
          echo "Low            : $LOW"
          echo "Informational  : $INFO"
          echo "Snyk exit code : $SNYK_EXIT_CODE"
          echo "--------------------------------------"

          FAILED=0

          if [[ "$FAIL_ON_CRITICAL" == "true" ]] && (( CRITICAL > 0 )); then
            echo "❌ Critical findings violate policy"
            FAILED=1
          fi

          if [[ "$FAIL_ON_HIGH" == "true" ]] && (( HIGH > 0 )); then
            echo "❌ High findings violate policy"
            FAILED=1
          fi

          if [[ "$FAIL_ON_MEDIUM" == "true" ]] && (( MEDIUM > 0 )); then
            echo "❌ Medium findings violate policy"
            FAILED=1
          fi

          if [[ "$FAIL_ON_LOW" == "true" ]] && (( LOW > 0 )); then
            echo "❌ Low findings violate policy"
            FAILED=1
          fi

          if [[ "$FAIL_ON_INFO" == "true" ]] && (( INFO > 0 )); then
            echo "❌ Informational findings violate policy"
            FAILED=1
          fi

          if (( FAILED != 0 )); then
            echo "❌ SECURITY GATE FAILED"
            exit 1
          fi

          echo "✅ SECURITY GATE PASSED"
      # - name: IaC Security Gate
      #   continue-on-error: true
      #   shell: bash
      #   run: |
      #     echo "=========================================================="
      #     echo "Starting Final Security Validation"
      #     echo "=========================================================="
        
      #     SNYK_RESULT=0
    
      #     echo ""
      #     echo "[INFO] Running Snyk IaC Scan..."
      #     snyk iac test . --severity-threshold=high || SNYK_RESULT=$?
    
      #     echo ""
      #     echo "=========================================================="
      #     echo "Security Scan Results"
      #     echo "=========================================================="
      #     echo "Snyk Exit Code : $SNYK_RESULT"
      #     echo "=========================================================="
    
      #     if [ "$SNYK_RESULT" -eq 0 ]; then
      #     echo ""
      #     echo "✅ SECURITY GATE PASSED"
      #     echo "✅ No HIGH or CRITICAL vulnerabilities detected."
      #     echo "✅ Code is allowed to proceed."
      #     echo ""
      #     exit 0
      #     fi
      #     echo ""
      #     echo "❌ SECURITY GATE FAILED"
      #     echo ""
    
      #     if [ "$SNYK_RESULT" -ne 0 ]; then
      #     echo "❌ Snyk detected HIGH/CRITICAL IaC findings OR encountered a scan error."
      #     fi
    
      #     echo ""
      #     echo "❌ Build blocked due to security policy."
      #     echo "❌ Review scan reports uploaded as GitHub artifacts."
      #     echo ""

      - name: Download ZAP Report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: zap-security-report
          path: zap-report

      # - name: Debug downloaded files
      #   run: |
      #     echo "Downloaded files:"
      #     ls -laR zap-report
      #     echo "Finding Files"
      #     find . -maxdepth 3 -name '*json*' -type f
          
      - name: ZAP Security Gate
        continue-on-error: true
        shell: bash
        run: |
          REPORT="zap-report/zap-report.json"

          if [[ ! -s "$REPORT" ]]; then
            echo "❌ Security Gate FAILED: ZAP report missing"
            exit 1
          fi

          HIGH_COUNT=$(jq '[.site[]?.alerts[]? | select((.riskcode | tostring) == "3")] | length' "$REPORT") || exit 1
          MEDIUM_COUNT=$(jq '[.site[]?.alerts[]? | select((.riskcode | tostring) == "2")] | length' "$REPORT") || exit 1
          LOW_COUNT=$(jq '[.site[]?.alerts[]? | select((.riskcode | tostring) == "1")] | length' "$REPORT") || exit 1
          INFO_COUNT=$(jq '[.site[]?.alerts[]? | select((.riskcode | tostring) == "1")] | length' "$REPORT") || exit 1


          if (( HIGH_COUNT > 0 || LOW_COUNT > 0 || INFO_COUNT > 0 )); then
          echo "❌ SECURITY GATE FAILED"

          if (( HIGH_COUNT > 0 )); then
          echo "High-risk findings: $HIGH_COUNT"
          fi

          if (( MEDIUM_COUNT > 0 )); then
          echo "Medium-risk findings: $MEDIUM_COUNT"
          fi

          if (( LOW_COUNT > 0 )); then
          echo "Low-risk findings: $LOW_COUNT"
          fi

          if (( INFO_COUNT > 0 )); then
          echo "Informational findings: $INFO_COUNT"
          fi

          exit 1
          fi

          echo "✅ SECURITY GATE PASSED"
          echo "No High, Low, or Informational findings detected."

