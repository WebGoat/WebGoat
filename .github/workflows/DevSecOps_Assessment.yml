name: DevSecOps Assessment

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
    - main
    - master
    
jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: returntocorp/semgrep
    steps:
    - uses: actions/checkout@v3
    - run: semgrep ci
