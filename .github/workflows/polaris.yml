name: Black Duck Polaris Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  polaris-security-scan:
    name: Polaris SAST & SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Black Duck Security Scan (Polaris)
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          ##polaris_application_name: "Acme Corp Core Apps"
          ##polaris_project_name: "WebGoat-Java"
          polaris_assessment_types: "SAST,SCA"
          
          ### Developer Feedback & Pull Request Guardrails ###
          polaris_prcomment_severities: "CRITICAL,HIGH"
          polaris_reports_sarif_create: true
          polaris_upload_sarif_report: true
          
          ### Policy Enforcement & Merge Gating ###
          polaris_waitForScan: true
          github_token: ${{ secrets.GITHUB_TOKEN }}